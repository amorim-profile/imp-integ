<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliotecas de Alta Compatibilidade -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.fb = { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, onSnapshot };
    </script>

    <style>
        .label-preview {
            background: white;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
        }
        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            margin-right: 12px;
        }
        .disabled-section {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(1);
        }
        .zone-indicator {
            border: 1px dashed #cbd5e1;
            position: relative;
        }
        .mode-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        #printModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #printModal.active { display: flex; }
        
        .toggle-checkbox:checked + .toggle-label { background-color: #2563eb; }
        .toggle-checkbox:checked + .toggle-label .toggle-dot { transform: translateX(100%); }

        #labelsChecklist::-webkit-scrollbar, 
        #letterRulesContainer::-webkit-scrollbar { width: 4px; }
        #labelsChecklist::-webkit-scrollbar-thumb,
        #letterRulesContainer::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media (max-width: 768px) {
            .sticky-preview { position: relative !important; top: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <div class="max-w-6xl mx-auto py-8 px-4">
        <header class="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-900 font-sans">Gerador de Etiquetas LPNs</h1>
                <p class="text-slate-600 font-sans text-sm">v9.7: Controlo de Range e Persistência.</p>
            </div>
            <div id="lastLpnBadge" class="hidden text-[10px] bg-indigo-700 text-white px-4 py-1.5 rounded-full font-bold uppercase tracking-widest shadow-sm">
                Último Gerado: <span id="lastLpnValue">---</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 font-sans">
            
            <div class="lg:col-span-1 space-y-6">
                <!-- Passo 1: Modo de Entrada -->
                <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                    <h2 class="text-lg font-bold mb-4 flex items-center text-slate-900">
                        <span class="step-number">1</span> Modo de Entrada
                    </h2>
                    
                    <div class="flex p-1 bg-slate-100 rounded-xl mb-4">
                        <button id="btnModeRange" class="mode-btn active flex-1 py-2 text-xs font-bold rounded-lg transition-all border border-transparent">SEQUENCIAL</button>
                        <button id="btnModeManual" class="mode-btn flex-1 py-2 text-xs font-bold rounded-lg transition-all border border-transparent">MANUAL</button>
                    </div>

                    <div id="rangeInputContainer" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest flex justify-between">
                                Descrição (Prefixo)
                                <span id="lastRangeInfo" class="text-indigo-600 font-black lowercase italic"></span>
                            </label>
                            <input type="text" id="rangePrefix" placeholder="Ex: LPN-" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-blue-500 text-sm p-2.5 border bg-white font-bold">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Início (Nº)</label>
                                <input type="number" id="rangeStart" placeholder="1000" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-blue-500 text-sm p-2.5 border bg-white font-bold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Fim (Nº)</label>
                                <input type="number" id="rangeEnd" placeholder="2000" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-blue-500 text-sm p-2.5 border bg-white font-bold">
                            </div>
                        </div>

                        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                            <label class="flex items-center cursor-pointer select-none">
                                <div class="relative">
                                    <input type="checkbox" id="allowRepetition" class="toggle-checkbox hidden">
                                    <div class="toggle-label block w-10 h-6 bg-slate-300 rounded-full transition-colors relative">
                                        <div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                                    </div>
                                </div>
                                <div class="ml-3">
                                    <p class="text-[11px] font-black text-blue-900 uppercase">Permitir Repetição</p>
                                    <p class="text-[9px] text-blue-700 italic">Ignorar histórico de numeração</p>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div id="manualInputContainer" class="hidden space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Descrição</label>
                            <input type="text" id="manualText" placeholder="Ex: A.001" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-blue-500 text-sm p-2.5 border bg-white font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Quantidade</label>
                            <input type="number" id="manualQty" value="1" min="1" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-blue-500 text-sm p-2.5 border bg-white font-bold">
                        </div>
                    </div>
                </section>

                <!-- Passo 2: Configurar Dados -->
                <section id="selectionSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 disabled-section transition-all duration-500">
                    <h2 class="text-lg font-bold mb-4 flex items-center text-slate-900">
                        <span class="step-number">2</span> Dados Gerados
                    </h2>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center mb-1">
                            <p id="sampleCounter" class="text-[10px] font-bold text-blue-600 uppercase">0 etiquetas prontas</p>
                            <div class="flex gap-3">
                                <button id="selectAllBtn" class="text-[10px] text-blue-600 font-black uppercase hover:underline">Tudo</button>
                                <button id="deselectAllBtn" class="text-[10px] text-red-600 font-black uppercase hover:underline">Limpar</button>
                            </div>
                        </div>

                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="Pesquisar etiqueta..." class="w-full pl-3 pr-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-medium">
                        </div>

                        <div id="labelsChecklist" class="max-h-48 overflow-y-auto border border-slate-200 rounded-lg p-1 bg-slate-50 space-y-1 font-mono text-xs">
                            <!-- Lista gerada dinamicamente -->
                        </div>
                    </div>
                </section>

                <!-- Passo 3: Layout e Ação -->
                <section id="configSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 disabled-section transition-all duration-500">
                    <h2 class="text-lg font-bold mb-4 flex items-center text-slate-900">
                        <span class="step-number">3</span> Layout e Ação
                    </h2>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3 pb-2 border-b border-slate-100">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Etiqueta L (mm)</label>
                                <input type="number" id="labelWidth" value="100" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Etiqueta A (mm)</label>
                                <input type="number" id="labelHeight" value="50" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 pb-2 border-b border-slate-100">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Tam. QR (mm)</label>
                                <input type="number" id="qrSizeInput" value="30" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase">Fonte Máx</label>
                                <input type="number" id="maxFontSize" value="100" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold">
                            </div>
                        </div>

                        <!-- Configurações de Margens Restauradas -->
                        <div class="grid grid-cols-2 gap-3 pb-2 border-b border-slate-100 bg-slate-50 p-2 rounded-lg">
                            <div>
                                <label class="block text-[10px] font-bold text-indigo-600 uppercase">Margem Geral (mm)</label>
                                <input type="number" id="labelMargin" value="3" class="w-full mt-1 p-2 border border-indigo-200 rounded-lg text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-indigo-600 uppercase">QR/Texto (mm)</label>
                                <input type="number" id="qrTextGap" value="5" class="w-full mt-1 p-2 border border-indigo-200 rounded-lg text-sm font-semibold">
                            </div>
                        </div>

                        <div class="bg-blue-50 p-3 rounded-xl space-y-3 border border-blue-100">
                            <p class="text-[10px] font-black text-blue-700 uppercase">Setas</p>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Direção Global</label>
                                    <select id="arrowType" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold bg-white">
                                        <option value="right">Direita</option>
                                        <option value="left">Esquerda</option>
                                        <option value="none" selected>Nenhuma</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Compr. (mm)</label>
                                    <input type="number" id="arrowSize" value="15" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold bg-white">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Espessura (mm)</label>
                                    <input type="number" id="arrowThickness" value="1.5" step="0.1" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold bg-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Txt/Seta (mm)</label>
                                    <input type="number" id="textArrowGap" value="3" class="w-full mt-1 p-2 border rounded-lg text-sm font-semibold bg-white">
                                </div>
                            </div>

                            <div class="mt-2 pt-2 border-t border-blue-200">
                                <p class="text-[9px] font-black text-blue-600 uppercase mb-2 text-center">Regras Automáticas (A a H)</p>
                                <div id="letterRulesContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-3 mt-4">
                            <button id="printBtn" disabled class="w-full bg-slate-400 text-white font-black py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 uppercase tracking-tight hover:scale-[1.02] border-b-4 border-slate-600">
                                VISUALIZAR IMPRESSÃO
                            </button>
                            <button id="generateBtn" disabled class="w-full bg-slate-400 text-white font-black py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 uppercase tracking-tight hover:scale-[1.02] opacity-80">
                                DESCARREGAR PDF
                            </button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Coluna Visualização Principal -->
            <div class="lg:col-span-2">
                <div class="sticky top-6 self-start space-y-6 sticky-preview">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-lg font-bold text-slate-900">Pré-visualização</h2>
                            <span id="labelDimensions" class="text-[10px] font-mono text-slate-400 uppercase">---</span>
                        </div>
                        <div id="previewWrapper" class="flex justify-center items-center bg-slate-100 p-4 md:p-10 rounded-2xl overflow-hidden min-h-[300px] md:min-h-[450px]">
                            <div id="previewContainer" class="label-preview"></div>
                        </div>
                    </div>

                    <div id="statusBox" class="hidden bg-white border-2 border-blue-100 p-6 rounded-2xl flex items-center gap-5 shadow-xl">
                        <div class="w-8 h-8 border-4 border-blue-700 border-t-transparent rounded-full animate-spin"></div>
                        <div>
                            <p id="statusTitle" class="font-black text-blue-900 uppercase text-sm">A Processar Documento</p>
                            <p id="statusMessage" class="text-xs text-blue-700 font-medium italic">Aguarde um momento...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Impressão -->
    <div id="printModal">
        <div class="bg-white w-full h-full max-w-5xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 uppercase text-sm">Visualização de Impressão</h3>
                <button id="closeModalBtn" class="text-red-600 font-bold text-xs uppercase hover:bg-red-50 p-2 rounded-lg">Fechar</button>
            </div>
            <iframe id="printFrame" class="flex-grow w-full h-full border-none"></iframe>
        </div>
    </div>

    <script type="module">
        const { jsPDF } = window.jspdf;

        // --- GESTÃO DE AMBIENTE ---
        let firebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) { console.warn("Ambiente local detetado."); }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lpn-gen-prod';
        let db, auth, user, lastGeneratedLpn = 0;

        // Estado Global
        let currentMode = 'range';
        let cleanAddresses = [];
        let selectedIndices = new Set();
        
        // Regras de Letras
        const letterRules = {};
        "ABCDEFGH".split('').forEach(l => {
            letterRules[l] = { odd: 'global', even: 'global' };
        });

        // Selectores
        const rangePrefix = document.getElementById('rangePrefix');
        const rangeStart = document.getElementById('rangeStart');
        const rangeEnd = document.getElementById('rangeEnd');
        const allowRepetition = document.getElementById('allowRepetition');
        const generateBtn = document.getElementById('generateBtn');
        const printBtn = document.getElementById('printBtn');
        const previewContainer = document.getElementById('previewContainer');
        const previewWrapper = document.getElementById('previewWrapper');
        const labelsChecklist = document.getElementById('labelsChecklist');
        const searchInput = document.getElementById('searchInput');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const statusBox = document.getElementById('statusBox');
        const statusMessage = document.getElementById('statusMessage');
        const letterRulesContainer = document.getElementById('letterRulesContainer');
        const lastRangeInfo = document.getElementById('lastRangeInfo');

        // Inicialização UI Regras
        function initLetterRulesUI() {
            if(!letterRulesContainer) return;
            letterRulesContainer.innerHTML = "ABCDEFGH".split('').map(l => `
                <div class="bg-white p-2 rounded border border-blue-100 shadow-sm">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[11px] font-black text-blue-800">Letra ${l}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[8px] uppercase text-slate-400 block font-bold">Ímpar</label>
                            <select onchange="window.updateRule('${l}', 'odd', this.value)" class="w-full text-[10px] p-1 border rounded bg-slate-50 font-bold">
                                <option value="global">Global</option>
                                <option value="right">Direita</option>
                                <option value="left">Esquerda</option>
                                <option value="none">Nenhuma</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[8px] uppercase text-slate-400 block font-bold">Par</label>
                            <select onchange="window.updateRule('${l}', 'even', this.value)" class="w-full text-[10px] p-1 border rounded bg-slate-50 font-bold">
                                <option value="global">Global</option>
                                <option value="right">Direita</option>
                                <option value="left">Esquerda</option>
                                <option value="none">Nenhuma</option>
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.updateRule = (letter, type, value) => {
            letterRules[letter][type] = value;
            updatePreview();
        };

        // Inicialização Firebase
        async function initFirebase() {
            if (!firebaseConfig) return;
            try {
                const app = window.fb.initializeApp(firebaseConfig);
                auth = window.fb.getAuth(app);
                db = window.fb.getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await window.fb.signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await window.fb.signInAnonymously(auth);
                }

                window.fb.onAuthStateChanged(auth, (u) => {
                    user = u;
                    if (user) setupDataSync();
                });
            } catch (err) { console.error("Erro Firebase:", err); }
        }

        function setupDataSync() {
            if (!db) return;
            const settingsDoc = window.fb.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            window.fb.onSnapshot(settingsDoc, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    lastGeneratedLpn = data.last_lpn || 0;
                    const lastRange = data.last_range || "";
                    
                    const badgeVal = document.getElementById('lastLpnValue');
                    if(badgeVal) badgeVal.textContent = lastGeneratedLpn;
                    document.getElementById('lastLpnBadge')?.classList.remove('hidden');
                    
                    if (lastRangeInfo) {
                        lastRangeInfo.textContent = lastRange ? `(última: ${lastRange})` : "";
                    }

                    syncData(); 
                }
            }, (err) => console.warn("Firestore Sync Error:", err));
        }

        async function updateLastLpn(val, rangeStr) {
            if (!user || !db || val <= lastGeneratedLpn) return;
            const settingsDoc = window.fb.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            await window.fb.setDoc(settingsDoc, { last_lpn: val, last_range: rangeStr }, { merge: true });
        }

        // Determinação de direção de seta com base em regras
        function resolveArrowDirection(addr) {
            if (!addr) return 'none';
            const firstChar = addr.charAt(0).toUpperCase();
            const numbers = addr.match(/\d+/g);
            const levelNum = numbers ? parseInt(numbers[0]) : 0; 
            const isOdd = levelNum % 2 !== 0;

            if (letterRules[firstChar]) {
                const rule = isOdd ? letterRules[firstChar].odd : letterRules[firstChar].even;
                if (rule !== 'global') return rule;
            }
            return document.getElementById('arrowType').value;
        }

        // Lógica de Sincronização
        function syncData() {
            let isValid = false;
            let sequenceError = false;
            const oldLength = cleanAddresses.length;

            if (currentMode === 'range') {
                const prefix = rangePrefix.value.trim();
                const start = parseInt(rangeStart.value);
                const end = parseInt(rangeEnd.value);
                const repeat = allowRepetition.checked;

                if (!isNaN(start) && !isNaN(end) && start <= end) {
                    isValid = true;
                    if (db && !repeat && start <= lastGeneratedLpn) {
                        sequenceError = true;
                    }
                    cleanAddresses = Array.from({ length: end - start + 1 }, (_, i) => String(prefix + (start + i)));
                } else {
                    cleanAddresses = [];
                }
            } else {
                const text = document.getElementById('manualText').value.trim() || "A.001";
                const qty = parseInt(document.getElementById('manualQty').value) || 1;
                cleanAddresses = Array(qty).fill(text);
                isValid = true; 
            }

            if (isValid && cleanAddresses.length > 0) {
                if (cleanAddresses.length !== oldLength || currentMode === 'manual') {
                    selectedIndices = new Set(cleanAddresses.keys());
                }
                
                document.getElementById('sampleCounter').textContent = `${cleanAddresses.length} etiquetas geradas`;
                document.getElementById('selectionSection').classList.remove('disabled-section');
                document.getElementById('configSection').classList.remove('disabled-section');
                
                renderChecklist();

                if (!sequenceError) {
                    enableActions();
                } else {
                    disableActionsOnly();
                    if (rangeStart.value !== "") {
                        showFeedback(`Não é permitido repetir. (Início ${rangeStart.value} já gerado)`, "error");
                    }
                }
                updatePreview();
            } else {
                disableAll();
            }
        }

        function renderChecklist() {
            const filter = searchInput.value.toLowerCase();
            labelsChecklist.innerHTML = cleanAddresses
                .map((addr, idx) => ({ addr, idx }))
                .filter(item => item.addr.toLowerCase().includes(filter))
                .map(item => `
                    <div class="flex items-center p-2 border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors" onclick="window.toggleLabelIdx(${item.idx})">
                        <input type="checkbox" class="mr-3 w-4 h-4 pointer-events-none" ${selectedIndices.has(item.idx) ? 'checked' : ''}>
                        <span class="truncate font-bold text-slate-700">${item.addr}</span>
                    </div>
                `).join('');
            
            const count = selectedIndices.size;
            document.getElementById('sampleCounter').textContent = `${count} de ${cleanAddresses.length} selecionadas`;
            
            if (count === 0) disableActionsOnly();
            else if (isValidCurrentState()) enableActions();
        }

        function isValidCurrentState() {
            if (currentMode === 'manual') return true;
            const start = parseInt(rangeStart.value);
            return !isNaN(start) && (allowRepetition.checked || !db || start > lastGeneratedLpn);
        }

        window.toggleLabelIdx = (idx) => {
            if (selectedIndices.has(idx)) selectedIndices.delete(idx);
            else selectedIndices.add(idx);
            renderChecklist();
            updatePreview();
        };

        selectAllBtn.onclick = () => {
            selectedIndices = new Set(cleanAddresses.keys());
            renderChecklist();
            updatePreview();
        };

        deselectAllBtn.onclick = () => {
            selectedIndices.clear();
            renderChecklist();
            updatePreview();
        };

        searchInput.oninput = renderChecklist;

        function enableActions() {
            if (selectedIndices.size === 0) return;
            generateBtn.disabled = false; printBtn.disabled = false;
            generateBtn.classList.replace('bg-slate-400', 'bg-slate-600');
            printBtn.classList.replace('bg-slate-400', 'bg-blue-600');
        }

        function disableActionsOnly() {
            generateBtn.disabled = true; printBtn.disabled = true;
            generateBtn.classList.replace('bg-slate-600', 'bg-slate-400');
            printBtn.classList.replace('bg-blue-600', 'bg-slate-400');
        }

        function disableAll() {
            disableActionsOnly();
            document.getElementById('selectionSection').classList.add('disabled-section');
            document.getElementById('configSection').classList.add('disabled-section');
            labelsChecklist.innerHTML = "";
        }

        function showFeedback(msg, type) {
            const old = document.querySelector('.feedback-banner');
            if (old) old.remove();
            const b = document.createElement('div');
            b.className = `feedback-banner fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl text-white font-bold text-xs shadow-2xl z-[100] transition-all ${type === 'error' ? 'bg-red-600' : 'bg-blue-600'}`;
            b.textContent = msg;
            document.body.appendChild(b);
            setTimeout(() => { if(b.parentNode) b.remove(); }, 3000);
        }

        function updatePreview() {
            if (cleanAddresses.length === 0 || selectedIndices.size === 0) {
                previewContainer.innerHTML = '<p class="text-slate-300 font-bold uppercase text-[10px]">Sem etiquetas selecionadas</p>';
                return;
            }
            
            const firstIdx = Array.from(selectedIndices).sort((a,b)=>a-b)[0];
            const addr = cleanAddresses[firstIdx];
            
            const w = parseFloat(document.getElementById('labelWidth').value) || 100;
            const h = parseFloat(document.getElementById('labelHeight').value) || 50;
            const qrS = parseFloat(document.getElementById('qrSizeInput').value) || 30;
            const marg = parseFloat(document.getElementById('labelMargin').value) || 3;
            const gap = parseFloat(document.getElementById('qrTextGap').value) || 5;
            const fs = parseFloat(document.getElementById('maxFontSize').value) || 100;
            const arrLen = parseFloat(document.getElementById('arrowSize').value) || 15;
            const arrThick = parseFloat(document.getElementById('arrowThickness').value) || 1.5;
            const textArrGap = parseFloat(document.getElementById('textArrowGap').value) || 3;

            const resolvedDir = resolveArrowDirection(addr);

            const availableWidth = previewWrapper.clientWidth - 40;
            const scale = Math.min(availableWidth / w, 4);

            previewContainer.style.width = `${w * scale}px`;
            previewContainer.style.height = `${h * scale}px`;
            previewContainer.style.padding = `${marg * scale}px`;
            previewContainer.innerHTML = '';

            const inner = document.createElement('div');
            inner.style.cssText = `width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;`;
            
            const qrZone = document.createElement('div');
            qrZone.className = "zone-indicator";
            qrZone.style.width = `${qrS * scale}px`;
            qrZone.style.height = `${qrS * scale}px`;
            
            const textContentZone = document.createElement('div');
            textContentZone.style.cssText = `display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:${gap * scale}px;`;

            const textZone = document.createElement('div');
            textZone.style.cssText = `font-weight:bold; text-align:center; font-size:${(fs * scale) / 5}px; line-height:1;`;
            textZone.textContent = addr;
            textContentZone.appendChild(textZone);

            if (resolvedDir !== 'none') {
                const arrowSpacer = document.createElement('div');
                arrowSpacer.style.height = `${textArrGap * scale}px`;
                textContentZone.appendChild(arrowSpacer);

                const arrowSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                arrowSvg.setAttribute("width", (arrLen * scale).toString());
                arrowSvg.setAttribute("height", (arrThick * 6 * scale).toString());
                const midY = arrThick * 3 * scale;
                const headSize = arrThick * 3 * scale;
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                const head = document.createElementNS("http://www.w3.org/2000/svg", "polygon");

                if (resolvedDir === 'right') {
                    line.setAttribute("x1", "0");
                    line.setAttribute("x2", (arrLen * scale - headSize).toString());
                    head.setAttribute("points", `${arrLen * scale},${midY} ${(arrLen * scale) - headSize},${midY - headSize/1.5} ${(arrLen * scale) - headSize},${midY + headSize/1.5}`);
                } else {
                    line.setAttribute("x1", headSize.toString());
                    line.setAttribute("x2", (arrLen * scale).toString());
                    head.setAttribute("points", `0,${midY} ${headSize},${midY - headSize/1.5} ${headSize},${midY + headSize/1.5}`);
                }
                line.setAttribute("y1", midY.toString()); line.setAttribute("y2", midY.toString());
                line.setAttribute("stroke", "black"); line.setAttribute("stroke-width", (arrThick * scale).toString());
                head.setAttribute("fill", "black");
                arrowSvg.appendChild(line); arrowSvg.appendChild(head);
                textContentZone.appendChild(arrowSvg);
            }

            inner.appendChild(qrZone);
            inner.appendChild(textContentZone);
            previewContainer.appendChild(inner);
            new QRCode(qrZone, { text: addr, width: qrS * scale, height: qrS * scale });
            document.getElementById('labelDimensions').textContent = `${w}x${h} mm`;
        }

        async function processOutput(mode) {
            if (selectedIndices.size === 0) return;
            statusBox.classList.remove('hidden');
            const w = parseFloat(document.getElementById('labelWidth').value);
            const h = parseFloat(document.getElementById('labelHeight').value);
            const qrS = parseFloat(document.getElementById('qrSizeInput').value);
            const marg = parseFloat(document.getElementById('labelMargin').value);
            const gap = parseFloat(document.getElementById('qrTextGap').value);
            const fsMax = parseFloat(document.getElementById('maxFontSize').value);
            const arrLen = parseFloat(document.getElementById('arrowSize').value);
            const arrThick = parseFloat(document.getElementById('arrowThickness').value);
            const textArrGap = parseFloat(document.getElementById('textArrowGap').value);
            const targets = Array.from(selectedIndices).sort((a,b)=>a-b).map(idx => cleanAddresses[idx]);

            try {
                const docPdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'mm', format: [w, h], compress: true });
                for (let i = 0; i < targets.length; i++) {
                    const addr = targets[i];
                    if (i > 0) docPdf.addPage([w, h], w > h ? 'l' : 'p');
                    const qrImg = await createQRImage(addr, 400);
                    const qrY = marg;
                    if (qrImg) docPdf.addImage(qrImg, 'PNG', (w/2)-(qrS/2), qrY, qrS, qrS);
                    const resolvedDir = resolveArrowDirection(addr);
                    const contentAreaY = qrY + qrS + gap;
                    const contentAreaH = h - contentAreaY - marg;
                    docPdf.setFont("Helvetica", "bold");
                    docPdf.setFontSize(fsMax);
                    let tw = docPdf.getTextWidth(addr);
                    let finalFs = fsMax;
                    if (tw > (w - marg*2)) finalFs *= (w - marg*2) / tw;
                    let textH = finalFs * 0.3527; 
                    const arrowSpace = (resolvedDir !== 'none') ? (arrThick + textArrGap) : 0;
                    const blockH = textH + arrowSpace;
                    if (blockH > contentAreaH) {
                        const adjust = contentAreaH / blockH;
                        finalFs *= adjust;
                        textH = finalFs * 0.3527;
                    }
                    docPdf.setFontSize(finalFs);
                    const totalH = textH + arrowSpace;
                    const startY = contentAreaY + (contentAreaH / 2) - (totalH / 2);
                    docPdf.text(addr, w/2, startY + (textH * 0.85), { align: 'center' });
                    if (resolvedDir !== 'none') {
                        const arrowY = startY + textH + textArrGap + (arrThick / 2);
                        const centerX = w / 2;
                        const headL = arrThick * 2.5;
                        const headW = arrThick * 1.5;
                        docPdf.setLineWidth(arrThick);
                        docPdf.setDrawColor(0);
                        docPdf.setFillColor(0);
                        if (resolvedDir === 'right') {
                            docPdf.line(centerX - (arrLen/2), arrowY, centerX + (arrLen/2) - headL, arrowY);
                            docPdf.triangle(centerX + (arrLen/2), arrowY, centerX + (arrLen/2) - headL, arrowY - headW, centerX + (arrLen/2) - headL, arrowY + headW, 'FD');
                        } else {
                            docPdf.line(centerX - (arrLen/2) + headL, arrowY, centerX + (arrLen/2), arrowY);
                            docPdf.triangle(centerX - (arrLen/2), arrowY, centerX - (arrLen/2) + headL, arrowY - headW, centerX - (arrLen/2) + headL, arrowY + headW, 'FD');
                        }
                    }
                    if (i % 25 === 0) {
                        statusMessage.textContent = `Processando: ${i+1}/${targets.length}`;
                        await new Promise(r => setTimeout(r, 1));
                    }
                }

                // Salva o último intervalo e ID na cloud
                if (db && currentMode === 'range') {
                    const startVal = rangeStart.value;
                    const endNum = parseInt(rangeEnd.value);
                    const currentRange = `${startVal}-${rangeEnd.value}`;
                    await updateLastLpn(endNum, currentRange);
                }

                if (mode === 'download') docPdf.save(`LPNs_${Date.now()}.pdf`);
                else {
                    const url = URL.createObjectURL(docPdf.output('blob'));
                    document.getElementById('printFrame').src = url;
                    document.getElementById('printModal').classList.add('active');
                }
            } catch (err) { console.error(err); showFeedback("Erro ao gerar PDF", "error"); } 
            finally { statusBox.classList.add('hidden'); }
        }

        function createQRImage(text, size) {
            return new Promise(res => {
                const div = document.createElement('div');
                div.style.position = 'absolute'; div.style.left = '-9999px';
                document.body.appendChild(div);
                new QRCode(div, { text, width: size, height: size });
                setTimeout(() => {
                    const img = div.querySelector('img');
                    res(img ? img.src : div.querySelector('canvas')?.toDataURL());
                    document.body.removeChild(div);
                }, 150);
            });
        }

        // Eventos
        document.getElementById('btnModeRange').onclick = () => {
            currentMode = 'range';
            document.getElementById('btnModeRange').classList.add('active');
            document.getElementById('btnModeManual').classList.remove('active');
            document.getElementById('rangeInputContainer').classList.remove('hidden');
            document.getElementById('manualInputContainer').classList.add('hidden');
            syncData();
        };

        document.getElementById('btnModeManual').onclick = () => {
            currentMode = 'manual';
            document.getElementById('btnModeManual').classList.add('active');
            document.getElementById('btnModeRange').classList.remove('active');
            document.getElementById('manualInputContainer').classList.remove('hidden');
            document.getElementById('rangeInputContainer').classList.add('hidden');
            syncData();
        };

        const elements = [rangePrefix, rangeStart, rangeEnd, allowRepetition, 
                          document.getElementById('manualText'), document.getElementById('manualQty'), 
                          document.getElementById('labelWidth'), document.getElementById('labelHeight'), 
                          document.getElementById('qrSizeInput'), document.getElementById('labelMargin'), 
                          document.getElementById('qrTextGap'), document.getElementById('maxFontSize'),
                          document.getElementById('arrowType'), document.getElementById('arrowSize'),
                          document.getElementById('arrowThickness'), document.getElementById('textArrowGap')];
        
        elements.forEach(el => {
            if (el) {
                el.addEventListener('input', syncData);
                el.addEventListener('change', syncData);
            }
        });

        generateBtn.onclick = () => processOutput('download');
        printBtn.onclick = () => processOutput('print');
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('printModal').classList.remove('active');

        window.onload = () => {
            initFirebase();
            initLetterRulesUI();
            syncData();
        };
    </script>
</body>
</html>
